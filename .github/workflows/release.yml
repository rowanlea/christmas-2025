name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            exe=hth
            if [ "$os" = windows ]; then exe=hth.exe; fi
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$stage/$exe" ./cmd/hth
            cp -r examples stubs README.md "$stage/"
            rm -rf "$stage/stubs/csharp/bin" "$stage/stubs/csharp/obj" "$stage/stubs/stubs_test.go"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/hth-$os-$arch.zip" .)
          done
          ls -l dist
      - name: Publish release with gh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.zip --clobber
